    <script>
      // iPhone(iOS) / Android を初回描画前に判定して専用UI・安全余白を適用 ＋ 自動キャッシュ更新
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var isIOS =
            /iPad|iPhone|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isAndroid = /Android/i.test(ua);
          var isStandalone =
            (window.matchMedia &&
              (window.matchMedia('(display-mode: standalone)').matches ||
                window.matchMedia('(display-mode: fullscreen)').matches)) ||
            window.navigator.standalone === true;
          document.documentElement.dataset.platform = isIOS
            ? 'ios'
            : isAndroid
            ? 'android'
            : 'desktop';
          document.documentElement.dataset.standalone = isStandalone ? 'true' : 'false';
        } catch (e) {}
      })();

      (function () {
        var APP_BUILD_VERSION = '2026.11.19.v13';
        try {
          var prevVer = localStorage.getItem('goshuin_app_build_ver');
          if (prevVer !== APP_BUILD_VERSION) {
            localStorage.setItem('goshuin_app_build_ver', APP_BUILD_VERSION);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var promises = regs.map(function (r) {
                  return r.unregister();
                });
                Promise.all(promises).then(function () {
                  if ('caches' in window) {
                    caches.keys().then(function (names) {
                      Promise.all(
                        names.map(function (n) {
                          return caches.delete(n);
                        })
                      ).then(function () {
                        window.location.reload();
                      });
                    });
                  } else {
                    window.location.reload();
                  }
                });
              });
            }
          } else if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].update();
              }
            });
          }
        } catch (e) {}
      })();
    </script>
